trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: "ubuntu-latest"

variables:
  nodeVersion: "20.x"

stages:
  - stage: build
    jobs:
      - job: build_and_test
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "$(nodeVersion)"
            displayName: "Install Node.js"

          - script: npm ci
            displayName: "npm ci"

          - script: npm run typecheck
            displayName: "Typecheck"

          - script: npm run lint
            displayName: "Lint"

          - script: npm test
            displayName: "Test"

          - script: npm run build
            displayName: "Build"

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: "$(System.DefaultWorkingDirectory)"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(Build.ArtifactStagingDirectory)/functionapp.zip"
              replaceExistingArchive: true
            displayName: "Archive sources"

          - publish: "$(Build.ArtifactStagingDirectory)/functionapp.zip"
            artifact: drop

  - stage: deploy
    dependsOn: build
    condition: and(succeeded(), ne(variables['functionAppName'], ''))
    jobs:
      - deployment: deploy_functions
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop
                - task: AzureFunctionApp@2
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    appType: functionApp
                    appName: "$(functionAppName)"
                    package: "$(Pipeline.Workspace)/drop/functionapp.zip"
                    runtimeStack: "NODE|20"
                  displayName: "Deploy Azure Function App"
